[General]
debug = True
log_level = info

[Hardware]
device = cuda

[Optim and loss]
optimizer = Adam
loss = BCEWithLogitsLoss

[Hyperparameters]
seed = 2026
target_rate = 16000
learning_rate = 0.001
n_classes = 10
n_best_rag = 3
frames_per_second = 50
audio_seconds = 10
epochs = 1000

[Scheduler]
scheduler = Sbzkz
scheduler_factor = 0.5
scheduler_patience = 2

[Early_stopping]
early_stopping_patience = 10
early_stopping_delta = 0.001

[Datas]
raw_train_datas_path = ./Data/raw/audio/train
raw_test_datas_path = ./Data/raw/audio/eval
train_metadata_path = ./Data/raw/metadata/train/public_weak.tsv
test_metadata_path = ./Data/raw/metadata/eval/public_weak.tsv

